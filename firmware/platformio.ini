; DeskMate DIY – firmware "ciała" robota (ESP32 + 2 serwa)
; Budowanie:  pio run -e esp32-s3
; Wgrywanie:  pio run -e esp32-s3 -t upload && pio device monitor

[platformio]
default_envs = esp32-s3

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    madhephaestus/ESP32Servo@^3.0.5
build_flags =
    -DCORE_DEBUG_LEVEL=1

; ESP32-S3 DevKitC-1 (zalecana płytka)
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_PAN=4
    -DPIN_TILT=5
    -DPIN_TOUCH=6

; Klasyczny ESP32 DevKit (WROOM-32)
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DPIN_PAN=18
    -DPIN_TILT=19
    -DPIN_TOUCH=23

; ESP32-C3 SuperMini (najmniejsza i najtańsza)
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_PAN=3
    -DPIN_TILT=4
    -DPIN_TOUCH=5
