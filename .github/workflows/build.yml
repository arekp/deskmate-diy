name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32-s3, esp32dev, esp32-c3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio run -d firmware -e ${{ matrix.env }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: deskmate-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile tools/ble_console.py desktop/screen_helper.py
