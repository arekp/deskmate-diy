name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32-s3, esp32dev, esp32-c3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio run -d firmware -e ${{ matrix.env }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Testy jednostkowe
        run: gradle -p android testDebugUnitTest --no-daemon
      - name: Budowanie APK
        run: |
          gradle -p android assembleDebug --no-daemon
          cp android/app/build/outputs/apk/debug/app-debug.apk deskmate-diy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: deskmate-diy-apk
          path: deskmate-diy.apk
      - name: Raport testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/

  release:
    # Publiczny link do APK: .../releases/latest/download/deskmate-diy.apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [firmware, android, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deskmate-diy-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DeskMate DIY – build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: deskmate-diy.apk
          body: |
            Automatyczna kompilacja z commita ${{ github.sha }}.
            Wersja testowa (debug). Instalacja: pobierz deskmate-diy.apk na telefonie i zezwól na instalację z nieznanych źródeł.

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile tools/ble_console.py desktop/screen_helper.py

  # Raport drukowalności STL (skill dfam-check z earthtojake/text-to-cad, MIT).
  # Nie blokuje wydania APK; błąd tylko przy nieszczelnej siatce.
  printability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .claude/skills/dfam-check/requirements.txt
      - run: pip install -r .claude/skills/dfam-check/requirements.txt
      - name: DfAM (FDM) – wszystkie STL
        run: python hardware/tools/dfam_report.py --out dfam-report.md
      - if: always()
        run: cat dfam-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfam-report
          path: dfam-report.md
